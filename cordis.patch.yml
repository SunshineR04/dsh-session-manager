# dsh-session-manager bundle layer: applied automatically when the package is
# installed (`package.json` declares `dsh.bundle.patch`), i.e. a profile that
# adds THIS package gets this wiring without any manual cordis.patch.yml edits.
# Later layers (the profile's own cordis.patch.yml, --patch overlays) override
# these rows by id.
#
# ⚠ Do NOT install this from the bare npm name `dsh-session-manager`: that name
# belongs to an UNRELATED published project (github.com/hkkz9522/dsh-session-
# manager, maintainer lesterq), which also registers a session menu row — so
# installing the wrong one looks like it worked. Install from this repository
# instead (see "Install" in README.md).
#
# The host row is purely additive: it registers the `/session-manager` RPC
# channel and the session-management agent tools (the `/sessions` slash-command
# family was removed in v0.3.0). No core row is touched, no core behavior is
# disabled.
- insert:
    - id: session-manager
      name: dsh-session-manager
