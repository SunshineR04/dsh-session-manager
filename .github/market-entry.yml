url: https://github.com/SunshineR04/dsh-session-manager
name: SunshineR04/dsh-session-manager
category: session
description:
  en: 'Manage archived sessions in the Settings page: restore or permanently delete them; adds a red delete item to the session context menu, /sessions slash commands and three agent tools. Open sessions delete immediately; the leftover in-memory copy stays hidden via an archive-set tombstone until the next restart.'
  zh: '在设置页管理已归档会话：恢复或彻底删除；会话菜单新增红色「彻底删除」项，附 /sessions 斜杠命令与三个 agent 工具。已打开的会话也能立即删除，残留的内存副本以归档集墓碑隐藏、重启后自动清理。'
