# Note: no slash-command claim — the desktop host does not mount the commands service.
url: https://github.com/SunshineR04/dsh-session-manager
name: SunshineR04/dsh-session-manager
category: session
description:
  en: 'Settings-page manager for archived DeepSeek Harness sessions: restore an archived session to its previous workspace position or permanently delete it (direct physical deletion, no backup layer). Adds a red permanently-delete item to the session context menu and three agent tools. Deleting an open session works immediately; the leftover in-memory copy is hidden behind an archive tombstone until the next restart. Session ids are validated at the manager boundary before any filesystem use and every durable mutation is serialized, so a tool call can never reach a path outside the sessions root; restoring a session queued for deletion is refused, as is cancelling a deletion whose files are already gone.'
  zh: '在设置页管理已归档会话：恢复或彻底删除（直接物理删除，无备份层）。会话菜单新增红色彻底删除项，附三个 agent 工具。已打开的会话也能立即删除，残留内存副本以归档墓碑隐藏、重启后自动清理。会话 id 在任何文件系统操作前于管理器边界统一校验、所有持久变更串行化，工具调用无法越出 sessions 根目录；恢复处于删除队列中的会话会被拒绝，取消一个文件已删的删除同样会被拒绝。'
